<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Royaume Rose</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Georgia, serif;
}

.map-container{
    position:relative;
    max-width:1600px;
    margin:auto;
}

.map{
    width:100%;
    display:block;
}

.marker{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    background:gold;
    border:3px solid white;
    box-shadow:0 0 15px gold;
    cursor:pointer;
    transition:0.3s;
}

.marker:hover{
    transform:scale(1.3);
}

.tooltip{
    position:absolute;
    bottom:55px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.9);
    color:white;
    padding:8px 12px;
    border-radius:8px;
    white-space:nowrap;
    font-size:14px;
    display:none;
}

.marker:hover .tooltip{
    display:block;
}

</style>
</head>

<body>

<div class="map-container">

<img src="./images/carte-royaume.jpg" class="map">

<!-- Nord -->
<div class="marker"
style="top:12%;left:50%;"
onclick="location.href='pages/nord/'">

<div class="tooltip">
❄️ Nord Glacial
</div>

</div>

<!-- Château -->
<div class="marker"
style="top:31%;left:50%;"
onclick="location.href='chateau.html'">

<div class="tooltip">
🏰 Château Rose Royal
</div>

</div>

<!-- Forêt -->
<div class="marker"
style="top:34%;left:22%;"
onclick="location.href='foret.html'">

<div class="tooltip">
🌹 Forêt des Roses Noires
</div>

</div>

<!-- Stratège -->
<div class="marker"
style="top:35%;left:82%;"
onclick="location.href='strategie.html'">

<div class="tooltip">
♟️ Tour du Stratège
</div>

</div>

<!-- Village -->
<div class="marker"
style="top:57%;left:45%;"
onclick="location.href='village.html'">

<div class="tooltip">
🏘️ Village Royal
</div>

</div>

<!-- Troubadours -->
<div class="marker"
style="top:64%;left:82%;"
onclick="location.href='troubadours.html'">

<div class="tooltip">
🎶 Hall des Troubadours
</div>

</div>

<!-- Sud -->
<div class="marker"
style="top:82%;left:50%;"
onclick="location.href='sud.html'">

<div class="tooltip">
☀️ Terres du Sud
</div>

</div>

</div>

</body>
</html>
