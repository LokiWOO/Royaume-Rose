<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Royaume Rose</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Georgia, serif;
}

.map-container{
    position:relative;
    max-width:1600px;
    margin:auto;
}

.map{
    width:100%;
    display:block;
}

.marker{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid white;
    background:gold;
    cursor:pointer;
    box-shadow:0 0 20px gold;
    transition:0.3s;
}

.marker:hover{
    transform:scale(1.4);
}

.popup{
    position:fixed;
    top:20px;
    right:20px;
    width:350px;
    max-height:80vh;
    overflow:auto;
    background:rgba(20,20,20,0.95);
    color:white;
    padding:20px;
    border-radius:15px;
    border:2px solid gold;
    display:none;
    z-index:999;
}

.close{
    float:right;
    cursor:pointer;
    color:gold;
    font-size:20px;
}

h2{
    color:#ffb6e1;
}

</style>
</head>

<body>

<div class="map-container">

<img src="./images/carte-royaume.jpg" class="map">

<!-- LOKIWOO -->
<div class="marker"
style="top:12%;left:50%;"
onclick="showLore('loki')"></div>

<!-- SANKA -->
<div class="marker"
style="top:31%;left:50%;"
onclick="showLore('sanka')"></div>

<!-- FORET -->
<div class="marker"
style="top:34%;left:22%;"
onclick="showLore('foret')"></div>

<!-- PSYKO -->
<div class="marker"
style="top:35%;left:82%;"
onclick="showLore('psyko')"></div>

<!-- VILLAGE -->
<div class="marker"
style="top:57%;left:45%;"
onclick="showLore('village')"></div>

<!-- TROUBADOUR -->
<div class="marker"
style="top:64%;left:82%;"
onclick="showLore('blackhawks')"></div>

<!-- ENZO -->
<div class="marker"
style="top:82%;left:50%;"
onclick="showLore('enzo')"></div>

</div>

<div id="popup" class="popup"></div>

<script>

function showLore(place){

let lore={

sanka:`
<span class="close" onclick="closeLore()">✖</span>

<h2>👑 Sanka</h2>

<h3>Reine du Royaume Rose</h3>

<p>
Depuis le Château Rose Royal,
Sanka veille sur les terres du royaume.
Sous sa protection prospèrent
le Nord, le Sud et les villages.
</p>
`,

loki:`
<span class="close" onclick="closeLore()">✖</span>

<h2>🎭 LokiWOO</h2>

<h3>Trickster des Armées du Nord</h3>

<p>
Gardien des forteresses glacées.
Maître de la ruse.
Protecteur de la frontière septentrionale.
</p>
`,

psyko:`
<span class="close" onclick="closeLore()">✖</span>

<h2>♟️ Psyk0Star</h2>

<h3>Grand Stratège Royal</h3>

<p>
Gardien des archives.
Conseiller militaire du Royaume Rose.
Maître des cartes et des plans.
</p>
`,

blackhawks:`
<span class="close" onclick="closeLore()">✖</span>

<h2>🎶 SK_BLACKHAWKS</h2>

<h3>Troubadour Royal</h3>

<p>
Chroniqueur officiel.
Gardien des légendes.
Conteur des exploits du royaume.
</p>
`,

enzo:`
<span class="close" onclick="closeLore()">✖</span>

<h2>🤝 Enzo50505050</h2>

<h3>Seigneur des Terres du Sud</h3>

<p>
Allié du Royaume Rose.
Co-signataire du Traité de l'Alliance avec LokiWOO.
Gardien des routes commerciales.
</p>
`,

foret:`
<span class="close" onclick="closeLore()">✖</span>

<h2>🌹 Forêt des Roses Noires</h2>

<p>
Lieu ancien et mystérieux.
Les roses poussent dans l'obscurité
et les légendes racontent que les esprits du royaume
y résident encore.
</p>
`,

village:`
<span class="close" onclick="closeLore()">✖</span>

<h2>🏘️ Village Royal</h2>

<ul>
<li>🔨 Forgeron</li>
<li>🐴 Palefrenier</li>
<li>🐑 Berger</li>
<li>🌾 Paysan</li>
<li>🍲 Cuisinier</li>
<li>⚔️ Chevalier Rose</li>
<li>⚖️ Bailli</li>
</ul>
`

};

document.getElementById("popup").style.display="block";
document.getElementById("popup").innerHTML=lore[place];

}

function closeLore(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
