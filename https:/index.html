<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royaume Rose</title>

<style>
body{
    background:#f7d9e8;
    font-family:Georgia, serif;
    margin:0;
}

h1{
    text-align:center;
    color:#8a2f6b;
}

#map{
    width:900px;
    height:600px;
    margin:20px auto;
    position:relative;
    background:#fff0f7;
    border:4px solid gold;
    border-radius:20px;
}

.place{
    position:absolute;
    background:white;
    border:2px solid #d96cb2;
    border-radius:10px;
    padding:10px;
    cursor:pointer;
}

#info{
    width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<h1>🌹 Royaume Rose 🌹</h1>

<div id="map">

<div class="place" style="top:40px;left:390px;"
onclick="showInfo('sanka')">
👑 Sanka
</div>

<div class="place" style="top:180px;left:80px;"
onclick="showInfo('loki')">
🎭 LokiWOO
</div>

<div class="place" style="top:180px;left:380px;"
onclick="showInfo('psyko')">
♟️ Psyk0Star
</div>

<div class="place" style="top:180px;left:650px;"
onclick="showInfo('blackhawks')">
🎶 SK_BLACKHAWKS
</div>

<div class="place" style="top:450px;left:350px;"
onclick="showInfo('enzo')">
🤝 Enzo50505050
</div>

</div>

<div id="info">
Clique sur une région du royaume.
</div>

<script>

function showInfo(personnage){

const infos = {

sanka: `
<h2>👑 Sanka</h2>
<p>Reine du Royaume Rose.</p>
`,

loki: `
<h2>🎭 LokiWOO</h2>
<p>Trickster des Armées du Nord.</p>
`,

psyko: `
<h2>♟️ Psyk0Star</h2>
<p>Grand Stratège Royal.</p>
`,

blackhawks: `
<h2>🎶 SK_BLACKHAWKS</h2>
<p>Troubadour Royal.</p>
`,

enzo: `
<h2>🤝 Enzo50505050</h2>
<p>Seigneur des Terres du Sud.</p>
`

};

document.getElementById("info").innerHTML = infos[personnage];

}

</script>

</body>
</html>
