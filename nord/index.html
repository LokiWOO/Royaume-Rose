<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ Nord Glacial</title>

<style>

body{
    margin:0;
    background:#08111f;
    font-family:Georgia, serif;
    overflow-x:hidden;
}

.map-container{
    position:relative;
    max-width:1600px;
    margin:auto;
}

.map{
    width:100%;
    display:block;
}

.marker{
    position:absolute;
    width:35px;
    height:35px;
    border-radius:50%;
    background:#00d9ff;
    border:3px solid white;
    box-shadow:0 0 20px #00d9ff;
    cursor:pointer;
    transition:0.3s;
}

.marker:hover{
    transform:scale(1.2);
}

.tooltip{
    position:absolute;
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.9);
    color:white;
    padding:8px 12px;
    border-radius:8px;
    white-space:nowrap;
    display:none;
}

.marker:hover .tooltip{
    display:block;
}

#panel{
    position:fixed;
    top:0;
    right:-420px;
    width:380px;
    height:100%;
    background:rgba(10,20,40,0.98);
    color:white;
    padding:25px;
    box-sizing:border-box;
    transition:0.4s;
    overflow-y:auto;
    border-left:3px solid #00d9ff;
    z-index:1000;
}

#panel.open{
    right:0;
}

#panel h2{
    color:#7de8ff;
}

.close-btn{
    background:#00d9ff;
    color:black;
    border:none;
    padding:10px;
    cursor:pointer;
    margin-bottom:20px;
    font-weight:bold;
    border-radius:8px;
}

.back{
    position:fixed;
    top:20px;
    left:20px;
    background:#111;
    color:gold;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
    z-index:999;
}

.back:hover{
    background:#222;
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:900;
}

#overlay.open{
    opacity:1;
    visibility:visible;
}

#panel{
    position:fixed;
    top:0;
    right:-450px;
    width:420px;
    height:100vh;

    background:rgba(8,15,35,0.92);
    backdrop-filter:blur(18px);

    border-left:2px solid rgba(0,217,255,0.4);

    box-shadow:
        -20px 0 60px rgba(0,0,0,0.7),
        inset 0 0 25px rgba(0,217,255,0.15);

    transition:.4s ease;
    z-index:1000;
    overflow-y:auto;
    color:white;
    padding:30px;
    box-sizing:border-box;
}

#panel.open{
    right:0;
}

#panel h2{
    color:#8fefff;
    font-size:30px;
    margin-top:50px;
}

#panel p{
    line-height:1.8;
    color:#dfefff;
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,0.15);
    color:white;

    cursor:pointer;
    font-size:20px;

    transition:.3s;
}

.close-btn:hover{
    background:#7de8ff;
    color:black;
    transform:rotate(90deg);
}

</style>
</head>

<body>

<a class="back" href="../">⬅ Retour au Royaume Rose</a>


<div class="ma<div class="map-container" onclick="closePanel()">
p-container">

<img src="nord-glacial.png" class="map" alt="Nord Glacial">

<!-- Palais de Givre -->
<div class="marker"
style="top:22%;left:50%;"
onclick="event.stopPropagation();showPlace('palais')">
<div class="tooltip">🏰 Palais de Givre</div>
</div>

<!-- Forteresse -->
<div class="marker"
style="top:33%;left:12%;"
onclick="event.stopPropagation();showPlace('forteresse')">
<div class="tooltip">🏯 Forteresse du Levant</div>
</div>

<!-- Village -->
<div class="marker"
style="top:73%;left:56%;"
onclick="event.stopPropagation();showPlace('village')">
<div class="tooltip">🏘️ Village d'Hivernel</div>
</div>

<!-- Grotte -->
<div class="marker"
style="top:44%;left:87%;"
onclick="event.stopPropagation();showPlace('grotte')">
<div class="tooltip">🕳️ Grotte Bleue</div>
</div>

<!-- Forêt -->
<div class="marker"
style="top:59%;left:20%;"
onclick="event.stopPropagation();showPlace('foret')">
<div class="tooltip">🐺 Forêt des Loups Blancs</div>
</div>

<!-- Pont -->
<div class="marker"
style="top:70%;left:77%;"
onclick="event.stopPropagation();showPlace('pont')">
<div class="tooltip">🌉 Pont des Cascades Gelées</div>
</div>

</div>
<div id="overlay" onclick="closePanel()"></div>
<div id="panel">

<button class="close-btn" onclick="closePanel()">
Fermer
</button>

<h2>❄️ Nord Glacial</h2>

<p>
Cliquez sur un lieu de la carte pour découvrir son histoire.
</p>

</div>

<script>

function showPlace(place){

const panel = document.getElementById("panel");
const overlay = document.getElementById("overlay");

panel.classList.add("open");
overlay.classList.add("open");

let content = "";

if(place==="palais"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Capitale Royale
</div>

<h2>🏰 Palais de Givre</h2>

<p>
Capitale du Nord Glacial et siège du pouvoir royal.
Ses immenses tours de glace dominent les montagnes éternelles.
Les bannières roses du Royaume Rose flottent au-dessus des falaises gelées.
</p>
`;
}

if(place==="forteresse"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Fortification Frontalière
</div>

<h2>🏯 Forteresse du Levant</h2>

<p>
Cette forteresse protège l'entrée occidentale du Nord.
Des chevaliers de glace y surveillent les routes depuis des siècles.
</p>
`;
}

if(place==="village"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Centre Commercial
</div>

<h2>🏘️ Village d'Hivernel</h2>

<p>
Le plus grand village du Nord Glacial.
Les artisans y travaillent le cristal de glace et les voyageurs y trouvent refuge.
</p>
`;
}

if(place==="grotte"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Lieu Mystique
</div>

<h2>🕳️ Grotte Bleue</h2>

<p>
Une immense caverne illuminée par des cristaux magiques.
Les légendes racontent qu'un ancien dragon de givre dort dans ses profondeurs.
</p>
`;
}

if(place==="foret"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Terres Sauvages
</div>

<h2>🐺 Forêt des Loups Blancs</h2>

<p>
Une forêt profonde où vivent les loups sacrés du Nord.
Peu d'aventuriers osent s'aventurer sous ses arbres enneigés.
</p>
`;
}

if(place==="pont"){
content = `
<button class="close-btn" onclick="closePanel()">✕</button>

<div style="color:#7de8ff;letter-spacing:2px;font-size:12px;text-transform:uppercase;">
Monument Historique
</div>

<h2>🌉 Pont des Cascades Gelées</h2>

<p>
Construit au-dessus d'anciennes chutes figées par la magie.
Il relie les terres de l'ouest au cœur du royaume.
</p>
`;
}

panel.innerHTML = content;
}

function closePanel(){

document.getElementById("panel")
.classList.remove("open");

document.getElementById("overlay")
.classList.remove("open");

}

</script>

</body>
</html>
